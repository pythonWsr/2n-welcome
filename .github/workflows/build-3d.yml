name: Build 3D spatial world

on:
  push:
    branches: [main]
    paths:
      - 'data/3d/2n-spatial-world/**'
      - '.github/workflows/build-3d.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data/3d/2n-spatial-world
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - name: Install
        run: npm install --no-package-lock
        
      - name: Test
        run: node --test test/*.test.js tests/*.test.js
        
      - name: Build
        run: npm run build
        
      - name: Commit build output via PR
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/3d/2n-spatial-world/dist
          
          # 检查是否有实际变更
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          # 生成唯一的分支名 (带上 run_attempt，避免重跑时冲突)
          BRANCH_NAME="auto-build-3d-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          
          # 提交并推送到新分支，加上 --force 防止因为之前失败的残留导致冲突
          git commit -m "chore(3d): rebuild spatial world [skip ci]"
          git push origin HEAD:$BRANCH_NAME --force
          
          # 创建 PR
          echo "Creating Pull Request..."
          gh pr create \
            --title "chore(3d): 自动构建更新 [skip ci]" \
            --body "由 GitHub Actions 自动生成的 3D 构建产物" \
            --base main \
            --head "$BRANCH_NAME"
            
          # 开启 Auto-merge (Squash) 并自动删除分支
          echo "Enabling auto-merge..."
          gh pr merge "$BRANCH_NAME" --auto --squash --delete-branch
