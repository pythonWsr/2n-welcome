name: Build 3D spatial world

on:
  push:
    branches: [main]
    paths:
      - 'data/3d/2n-spatial-world/**'
      - '.github/workflows/build-3d.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data/3d/2n-spatial-world
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm install --no-package-lock
      - name: Test
        run: node --test test/*.test.js tests/*.test.js
      - name: Build
        run: npm run build
      - name: Commit build output
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/3d/2n-spatial-world/dist
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(3d): rebuild spatial world [skip ci]"
            git push
          fi
