name: Publish spatial world to GitHub Pages
on:
  push:
    branches: [main, sync/persistent-3d-2026-09-27]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: node --test test/*.test.js tests/*.test.js
      - uses: actions/configure-pages@v5
      - run: npm run build -- --base=/2n-spatial-world/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
