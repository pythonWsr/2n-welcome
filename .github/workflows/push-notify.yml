- name: Create issue to notify pythonWsr
  if: github.event_name == 'push' && steps.diff.outputs.skip != 'true'
  uses: actions/github-script@v8
  env:
    SUMMARY_FILE: ${{ steps.diff.outputs.summary_file }}
    FULL_FILE: ${{ steps.diff.outputs.full_file }}
    CLOSED_COUNT: ${{ steps.stale.outputs.closed_count }}
    CLOSED_LIST: ${{ steps.stale.outputs.closed_issues }}
    REVERTED_COUNT: ${{ steps.revert.outputs.reverted_count }}
    REVERTED_LIST: ${{ steps.revert.outputs.reverted_issues }}
  with:
    script: |
      const fs = require('fs');

      const event = JSON.parse(
        fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8')
      );
      const commits = event.commits || [];
      const before = event.before || '';
      const after = event.after || '';
      const forced = event.forced === true;

      const summaryFile = process.env.SUMMARY_FILE;
      const fullFile = process.env.FULL_FILE;
      const closedCount = parseInt(process.env.CLOSED_COUNT || '0', 10);
      const closedList = process.env.CLOSED_LIST || '';
      const revertedCount = parseInt(process.env.REVERTED_COUNT || '0', 10);
      const revertedList = process.env.REVERTED_LIST || '';
      const MAX_BODY = 65536;

      const summary = fs.existsSync(summaryFile)
        ? fs.readFileSync(summaryFile, 'utf8')
        : '(无变更)';

      const headSha = '${{ github.sha }}';
      const actor = '${{ github.actor }}';
      // 如果推送者不是你自己，就在 Issue 里同时 @ 对方
      const actorMention = actor !== 'pythonWsr' ? ` @${actor}` : '';

      let commitLines;
      if (commits.length > 0) {
        commitLines = commits.map(c => {
          const firstLine = (c.message || '').split('\n')[0];
          const prMatch = firstLine.match(/\(#(\d+)\)$/);
          let suffix = '';
          if (prMatch) {
            suffix = ` [PR #${prMatch[1]}](https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${prMatch[1]})`;
          }
          return `- \`${c.id.substring(0,7)}\` ${firstLine}${suffix}`;
        }).join('\n');
      } else if (forced && before && after) {
        commitLines = `(force push) ${before.slice(0,7)} → ${after.slice(0,7)}`;
      } else {
        commitLines = `\`${headSha}\``;
      }

      const staleSection = closedCount > 0
        ? `\n\n--- 已关闭的过期 Issue（超过 90 天，共 ${closedCount} 个）---\n${closedList}\n`
        : '';

      const revertedSection = revertedCount > 0
        ? `\n\n--- 因回退而关闭的 Issue（共 ${revertedCount} 个）---\n${revertedList}\n`
        : '';

      const header = `@pythonWsr${actorMention} 有新推送

      推送者: ${actor}
      推送时间: ${{ github.event.head_commit.timestamp }}
      仓库: ${{ github.repository }}
      分支: ${{ github.ref_name }}
      Commit: ${headSha}

      --- 本次提交 ---
      ${commitLines}${staleSection}${revertedSection}

      --- Diff 摘要 ---
      \`\`\`
      ${summary}
      \`\`\`
      `;

      let fullContent = '';
      let omitted = false;
      if (fs.existsSync(fullFile)) {
        const fullSize = fs.statSync(fullFile).size;
        const estimated = header.length
          + '\n\n--- 完整 Diff ---\n```diff\n\n```\n'.length
          + fullSize;
        if (estimated > MAX_BODY) {
          omitted = true;
        } else {
          fullContent = fs.readFileSync(fullFile, 'utf8');
        }
      }

      let body;
      if (!omitted) {
        body = header + `

      --- 完整 Diff ---
      \`\`\`diff
      ${fullContent}
      \`\`\`
      `;
      } else {
        body = header + `\n\n> ⚠️ 完整 diff 超过 ${MAX_BODY} 字符限制，已省略。`;
      }

      await github.rest.issues.create({
        owner: context.repo.owner,
        repo: context.repo.repo,
        title: `[Push] ${{ github.repository }} - ${actor}`,
        body: body
      });
