name: Push Notification via Issue

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch before sha (force push 回退检测用)
        if: github.event.forced == true
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "before 为空或全零，跳过。"
            exit 0
          fi
          if git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "before ($BEFORE) 已存在本地。"
            exit 0
          fi
          echo "尝试 fetch before: $BEFORE"
          git fetch origin "$BEFORE" --depth=1 2>/dev/null || \
          git fetch origin "$BEFORE" 2>/dev/null || \
          echo "fetch 失败（对象可能已被 gc）。"

      - name: Generate diff files
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          FORCED: ${{ github.event.forced }}
        run: |
          SUMMARY_FILE="$RUNNER_TEMP/push-summary.txt"
          FULL_FILE="$RUNNER_TEMP/push-full.txt"
          echo "summary_file=$SUMMARY_FILE" >> $GITHUB_OUTPUT
          echo "full_file=$FULL_FILE" >> $GITHUB_OUTPUT

          RANGE=""
          if [ "$FORCED" = "true" ] && [ -n "$BEFORE" ] && \
             [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && \
             git cat-file -e "$BEFORE" 2>/dev/null; then
            RANGE="$BEFORE $AFTER"
            echo "Force push 检测：diff $BEFORE..$AFTER"
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            RANGE="HEAD~1 HEAD"
          else
            RANGE="--cached"
          fi

          # 摘要直接写文件，避免 shell 变量 + env 注入
          git diff --stat $RANGE > "$SUMMARY_FILE" 2>/dev/null || true

          if [ ! -s "$SUMMARY_FILE" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "本次推送无实际文件变更，跳过。"
            exit 0
          fi

          echo "skip=false" >> $GITHUB_OUTPUT

          # 完整 diff 直接重定向到文件，不进变量
          git diff $RANGE > "$FULL_FILE" 2>/dev/null || true
          echo "完整 diff 大小: $(wc -c < "$FULL_FILE") 字节"

      - name: Close issues older than 6 months
        if: steps.diff.outputs.skip != 'true'
        id: stale
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff = new Date();
            cutoff.setMonth(cutoff.getMonth() - 6);

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100
              }
            );

            const closed = [];
            for (const issue of issues) {
              if (issue.pull_request) continue;
              if (!issue.title.startsWith('[Push]')) continue;
              if (new Date(issue.created_at) < cutoff) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed'
                });
                closed.push(`#${issue.number} ${issue.title}（创建于 ${issue.created_at}）`);
              }
            }

            core.setOutput('closed_count', closed.length);
            core.setOutput('closed_issues', closed.join('\n'));

      - name: Close issues whose commit was reverted
        if: steps.diff.outputs.skip != 'true'
        id: revert
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            // 从 GITHUB_EVENT_PATH 读取整个事件，避免 toJSON 内联
            const event = JSON.parse(
              fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8')
            );
            const commits = event.commits || [];
            const before = event.before || '';
            const after = event.after || '';
            const forced = event.forced === true;

            const droppedShas = new Set();

            // ① 普通 git revert
            for (const c of commits) {
              const msg = c.message || '';
              for (const m of msg.matchAll(/This reverts commit ([0-9a-f]{7,40})\./g)) {
                droppedShas.add(m[1].toLowerCase());
              }
            }

            // ② force push 丢弃的提交
            const zero = '0000000000000000000000000000000000000000';
            if (forced && before && before !== zero && after) {
              try {
                execSync(`git cat-file -e ${before}`, { stdio: 'ignore' });
                const out = execSync(
                  `git log --format=%H ${after}..${before}`,
                  { encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'] }
                );
                out.trim().split('\n').filter(Boolean)
                   .forEach(s => droppedShas.add(s.toLowerCase()));
                console.log(`force push: 识别到 ${droppedShas.size} 个被丢弃的提交`);
              } catch (e) {
                console.log('无法列出被丢弃的提交:', e.message);
              }
            }

            if (droppedShas.size === 0) {
              core.setOutput('reverted_count', 0);
              core.setOutput('reverted_issues', '');
              return;
            }

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100
              }
            );

            function issueMatchesSha(body, sha) {
              if (!body) return false;
              const m = body.match(/Commit:\s*([0-9a-f]{7,40})/i);
              if (!m) return false;
              const bodySha = m[1].toLowerCase();
              const target = sha.toLowerCase();
              return bodySha.startsWith(target) || target.startsWith(bodySha);
            }

            const closed = [];
            for (const issue of issues) {
              if (issue.pull_request) continue;
              if (!issue.title.startsWith('[Push]')) continue;
              for (const sha of droppedShas) {
                if (issueMatchesSha(issue.body, sha)) {
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    state: 'closed'
                  });
                  closed.push(`#${issue.number} ${issue.title}（对应提交 ${sha.slice(0,7)} 被回退）`);
                  break;
                }
              }
            }

            core.setOutput('reverted_count', closed.length);
            core.setOutput('reverted_issues', closed.join('\n'));

      - name: Create issue to notify pythonWsr
        if: steps.diff.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          SUMMARY_FILE: ${{ steps.diff.outputs.summary_file }}
          FULL_FILE: ${{ steps.diff.outputs.full_file }}
          CLOSED_COUNT: ${{ steps.stale.outputs.closed_count }}
          CLOSED_LIST: ${{ steps.stale.outputs.closed_issues }}
          REVERTED_COUNT: ${{ steps.revert.outputs.reverted_count }}
          REVERTED_LIST: ${{ steps.revert.outputs.reverted_issues }}
        with:
          script: |
            const fs = require('fs');

            const event = JSON.parse(
              fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8')
            );
            const commits = event.commits || [];
            const before = event.before || '';
            const after = event.after || '';
            const forced = event.forced === true;

            const summaryFile = process.env.SUMMARY_FILE;
            const fullFile = process.env.FULL_FILE;
            const closedCount = parseInt(process.env.CLOSED_COUNT || '0', 10);
            const closedList = process.env.CLOSED_LIST || '';
            const revertedCount = parseInt(process.env.REVERTED_COUNT || '0', 10);
            const revertedList = process.env.REVERTED_LIST || '';
            const MAX_BODY = 65536;

            // 摘要从文件读（一般很小）
            const summary = fs.existsSync(summaryFile)
              ? fs.readFileSync(summaryFile, 'utf8')
              : '(无变更)';

            const headSha = '${{ github.sha }}';

            let commitLines;
            if (commits.length > 0) {
              commitLines = commits
                .map(c => `${c.id}  ${(c.message || '').split('\n')[0]}`)
                .join('\n');
            } else if (forced && before && after) {
              commitLines = `(force push) ${before.slice(0,7)} → ${after.slice(0,7)}`;
            } else {
              commitLines = `${headSha}`;
            }

            const staleSection = closedCount > 0
              ? `\n\n--- 已关闭的过期 Issue（超过 6 个月，共 ${closedCount} 个）---\n${closedList}\n`
              : '';

            const revertedSection = revertedCount > 0
              ? `\n\n--- 因回退而关闭的 Issue（共 ${revertedCount} 个）---\n${revertedList}\n`
              : '';

            const header = `@pythonWsr 有新推送

            推送者: ${{ github.actor }}
            推送时间: ${{ github.event.head_commit.timestamp }}
            仓库: ${{ github.repository }}
            分支: ${{ github.ref_name }}
            Commit: ${headSha}

            --- 本次提交 ---
            ${commitLines}${staleSection}${revertedSection}

            --- Diff 摘要 ---
            \`\`\`
            ${summary}
            \`\`\`
            `;

            // 先估算 full 文件大小，避免把巨大内容读进内存拼接
            let fullContent = '';
            let omitted = false;
            if (fs.existsSync(fullFile)) {
              const fullSize = fs.statSync(fullFile).size;
              const estimated = header.length
                + '\n\n--- 完整 Diff ---\n```diff\n\n```\n'.length
                + fullSize;
              if (estimated > MAX_BODY) {
                omitted = true;
              } else {
                fullContent = fs.readFileSync(fullFile, 'utf8');
              }
            }

            let body;
            if (!omitted) {
              body = header + `

            --- 完整 Diff ---
            \`\`\`diff
            ${fullContent}
            \`\`\`
            `;
            } else {
              body = header + `\n\n> ⚠️ 完整 diff 超过 ${MAX_BODY} 字符限制，已省略。`;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Push] ${{ github.repository }} - ${{ github.actor }}`,
              body: body
            });
