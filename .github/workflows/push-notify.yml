name: Push Notification via Issue

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch before sha (force push 回退检测用)
        if: github.event.forced == true
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "before 为空或全零，跳过。"
            exit 0
          fi
          if git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "before ($BEFORE) 已存在本地。"
            exit 0
          fi
          echo "尝试 fetch before: $BEFORE"
          git fetch origin "$BEFORE" --depth=1 2>/dev/null || \
          git fetch origin "$BEFORE" 2>/dev/null || \
          echo "fetch 失败（对象可能已被 gc）。"

      - name: Generate diff summary and full diff
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          FORCED: ${{ github.event.forced }}
        run: |
          # 决定 diff 范围
          RANGE=""
          if [ "$FORCED" = "true" ] && [ -n "$BEFORE" ] && \
             [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && \
             git cat-file -e "$BEFORE" 2>/dev/null; then
            RANGE="$BEFORE $AFTER"
            echo "Force push 检测：diff $BEFORE..$AFTER"
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            RANGE="HEAD~1 HEAD"
          else
            RANGE="--cached"
          fi

          SUMMARY=$(git diff --stat $RANGE)
          if [ -z "$SUMMARY" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "本次推送无实际文件变更，跳过。"
            exit 0
          fi

          echo "skip=false" >> $GITHUB_OUTPUT
          FULL=$(git diff $RANGE)

          echo "DIFF_SUMMARY<<EOF" >> $GITHUB_ENV
          echo "$SUMMARY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          echo "DIFF_FULL<<EOF" >> $GITHUB_ENV
          echo "$FULL" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Close issues older than 6 months
        if: steps.diff.outputs.skip != 'true'
        id: stale
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff = new Date();
            cutoff.setMonth(cutoff.getMonth() - 6);

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100
              }
            );

            const closed = [];
            for (const issue of issues) {
              if (issue.pull_request) continue;
              if (!issue.title.startsWith('[Push]')) continue;
              if (new Date(issue.created_at) < cutoff) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed'
                });
                closed.push(`#${issue.number} ${issue.title}（创建于 ${issue.created_at}）`);
              }
            }

            core.setOutput('closed_count', closed.length);
            core.setOutput('closed_issues', closed.join('\n'));

      - name: Close issues whose commit was reverted
        if: steps.diff.outputs.skip != 'true'
        id: revert
        uses: actions/github-script@v7
        env:
          COMMITS: ${{ toJSON(github.event.commits) }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          FORCED: ${{ github.event.forced }}
        with:
          script: |
            const { execSync } = require('child_process');

            const commits = JSON.parse(process.env.COMMITS || '[]');
            const before = process.env.BEFORE || '';
            const after = process.env.AFTER || '';
            const forced = process.env.FORCED === 'true';

            const droppedShas = new Set();

            // ① git revert 提交
            for (const c of commits) {
              const msg = c.message || '';
              for (const m of msg.matchAll(/This reverts commit ([0-9a-f]{7,40})\./g)) {
                droppedShas.add(m[1].toLowerCase());
              }
            }

            // ② force push 丢弃的提交
            const zero = '0000000000000000000000000000000000000000';
            if (forced && before && before !== zero && after) {
              try {
                execSync(`git cat-file -e ${before}`, { stdio: 'ignore' });
                const out = execSync(
                  `git log --format=%H ${after}..${before}`,
                  { encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'] }
                );
                out.trim().split('\n').filter(Boolean)
                   .forEach(s => droppedShas.add(s.toLowerCase()));
                console.log(`force push: 识别到 ${droppedShas.size} 个被丢弃的提交`);
              } catch (e) {
                console.log('无法列出被丢弃的提交:', e.message);
              }
            }

            if (droppedShas.size === 0) {
              core.setOutput('reverted_count', 0);
              core.setOutput('reverted_issues', '');
              return;
            }

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100
              }
            );

            // 正文里的 Commit: <sha>，支持短 sha 与完整 sha 互相匹配
            function issueMatchesSha(body, sha) {
              if (!body) return false;
              const m = body.match(/Commit:\s*([0-9a-f]{7,40})/i);
              if (!m) return false;
              const bodySha = m[1].toLowerCase();
              const target = sha.toLowerCase();
              return bodySha.startsWith(target) || target.startsWith(bodySha);
            }

            const closed = [];
            for (const issue of issues) {
              if (issue.pull_request) continue;
              if (!issue.title.startsWith('[Push]')) continue;
              for (const sha of droppedShas) {
                if (issueMatchesSha(issue.body, sha)) {
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    state: 'closed'
                  });
                  closed.push(`#${issue.number} ${issue.title}（对应提交 ${sha.slice(0,7)} 被回退）`);
                  break;
                }
              }
            }

            core.setOutput('reverted_count', closed.length);
            core.setOutput('reverted_issues', closed.join('\n'));

      - name: Create issue to notify pythonWsr
        if: steps.diff.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          CLOSED_COUNT: ${{ steps.stale.outputs.closed_count }}
          CLOSED_LIST: ${{ steps.stale.outputs.closed_issues }}
          REVERTED_COUNT: ${{ steps.revert.outputs.reverted_count }}
          REVERTED_LIST: ${{ steps.revert.outputs.reverted_issues }}
          COMMITS: ${{ toJSON(github.event.commits) }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          FORCED: ${{ github.event.forced }}
        with:
          script: |
            const summary = process.env.DIFF_SUMMARY || '(无变更)';
            const full = process.env.DIFF_FULL || '';
            const closedCount = parseInt(process.env.CLOSED_COUNT || '0', 10);
            const closedList = process.env.CLOSED_LIST || '';
            const revertedCount = parseInt(process.env.REVERTED_COUNT || '0', 10);
            const revertedList = process.env.REVERTED_LIST || '';
            const forced = process.env.FORCED === 'true';
            const before = process.env.BEFORE || '';
            const after = process.env.AFTER || '';
            const MAX_BODY = 65536;

            const commits = JSON.parse(process.env.COMMITS || '[]');
            const headSha = '${{ github.sha }}';

            // 提交列表：普通 push 用 commits；force push 用 before → after 提示
            let commitLines;
            if (commits.length > 0) {
              commitLines = commits
                .map(c => `${c.id}  ${(c.message || '').split('\n')[0]}`)
                .join('\n');
            } else if (forced && before && after) {
              commitLines = `(force push) ${before.slice(0,7)} → ${after.slice(0,7)}`;
            } else {
              commitLines = `${headSha}`;
            }

            const staleSection = closedCount > 0
              ? `\n\n--- 已关闭的过期 Issue（超过 6 个月，共 ${closedCount} 个）---\n${closedList}\n`
              : '';

            const revertedSection = revertedCount > 0
              ? `\n\n--- 因回退而关闭的 Issue（共 ${revertedCount} 个）---\n${revertedList}\n`
              : '';

            const header = `@pythonWsr 有新推送

            推送者: ${{ github.actor }}
            推送时间: ${{ github.event.head_commit.timestamp }}
            仓库: ${{ github.repository }}
            分支: ${{ github.ref_name }}
            Commit: ${headSha}

            --- 本次提交 ---
            ${commitLines}${staleSection}${revertedSection}

            --- Diff 摘要 ---
            \`\`\`
            ${summary}
            \`\`\`
            `;

            const fullSection = `

            --- 完整 Diff ---
            \`\`\`diff
            ${full}
            \`\`\`
            `;

            let body;
            if (header.length + fullSection.length <= MAX_BODY) {
              body = header + fullSection;
            } else {
              body = header + `\n\n> ⚠️ 完整 diff 超过 ${MAX_BODY} 字符限制，已省略。`;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Push] ${{ github.repository }} - ${{ github.actor }}`,
              body: body
            });
