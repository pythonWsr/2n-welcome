<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>[2n] 公会 · 欢迎</title>
  <script>
    (function() {
      var ts = Date.now();
      document.write('<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">');
      document.write('<link rel="stylesheet" href="./main/css/base.css?v=' + ts + '">');
      document.write('<link rel="stylesheet" href="./main/css/components.css?v=' + ts + '">');
      var stored = localStorage.getItem('theme-mode');
      var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var useDark = stored === 'dark' || (!stored && systemDark);
      var themeHref = useDark ? './main/css/theme-dark.css' : './main/css/theme-light.css';
      document.write('<link rel="stylesheet" id="theme-link" href="' + themeHref + '?v=' + ts + '">');
    })();
  </script>
  <script>
    (function() {
      try {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        mq.addEventListener('change', function(e) {
          if (localStorage.getItem('theme-mode')) return;
          var link = document.getElementById('theme-link');
          if (link) link.href = (e.matches ? './main/css/theme-dark.css' : './main/css/theme-light.css') + '?v=' + Date.now();
        });
      } catch (e) {}
    })();
  </script>

<!-- 栏目切换 + 内容加载 -->
<script type="module">
  import { parseWiki } from './main/wikiParser.js';

  const tabTrack = document.getElementById('tabTrack');
  const tabContent = document.getElementById('tabContent');
  const wikiCache = {};
  let tabsConfig = [];
  let currentTab = null;

  const LAST_TAB_KEY = 'main-last-tab';

  function resolveTitle(title) {
    if (typeof title === 'string') return title;
    if (title && typeof title === 'object') {
      const lang = (navigator.language || 'zh').toLowerCase().startsWith('zh') ? 'zh' : 'en';
      return title[lang] || title.zh || title.en || '';
    }
    return '';
  }

  async function processHtmlContent(html) {
    const doc = new DOMParser().parseFromString(html, 'text/html');

    doc.querySelectorAll('link[rel="stylesheet"]').forEach(link => {
      const href = link.getAttribute('href');
      if (!href) return;
      const resolved = new URL(href, window.location.href).href;
      const exists = Array.from(document.querySelectorAll('link[rel="stylesheet"]'))
        .some(l => l.href === resolved);
      if (!exists) {
        const newLink = document.createElement('link');
        newLink.rel = 'stylesheet';
        newLink.href = resolved;
        document.head.appendChild(newLink);
      }
    });

    const scripts = Array.from(doc.querySelectorAll('script'));
    scripts.forEach(s => s.remove());

    tabContent.innerHTML = doc.body.innerHTML;

    for (const oldScript of scripts) {
      await runScript(oldScript);
    }
  }

  function runScript(oldScript) {
    return new Promise(resolve => {
      const newScript = document.createElement('script');
      if (oldScript.type) newScript.type = oldScript.type;
      if (oldScript.src) {
        newScript.src = oldScript.src;
        newScript.onload = resolve;
        newScript.onerror = resolve;
      } else {
        newScript.textContent = oldScript.textContent;
      }
      document.body.appendChild(newScript);
      if (!oldScript.src) resolve();
    });
  }

  async function loadTab(tab) {
    if (!tab) return;
    currentTab = tab;
    sessionStorage.setItem(LAST_TAB_KEY, tab.id);

    tabTrack.querySelectorAll('.tab-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === tab.id);
    });

    tabContent.innerHTML = '<div class="placeholder-content">加载中...</div>';

    const path = `./${tab.folder}/${tab.entry}?_=${Date.now()}`;
    try {
      const res = await fetch(path);
      if (!res.ok) throw new Error('加载失败');
      const text = await res.text();

      if (tab.entry.endsWith('.wiki')) {
        if (!wikiCache[tab.id]) wikiCache[tab.id] = parseWiki(text);
        tabContent.innerHTML = wikiCache[tab.id];
      } else if (tab.entry.endsWith('.html')) {
        await processHtmlContent(text);
      } else if (tab.entry.endsWith('.json')) {
        tabContent.innerHTML = `<pre style="white-space:pre-wrap;">${escapeHtml(text)}</pre>`;
      } else {
        tabContent.innerHTML = text;
      }
    } catch (e) {
      console.error(`栏目 ${tab.id} 加载失败:`, e);
      tabContent.innerHTML = '<div class="placeholder-content">内容加载失败</div>';
    }
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function buildTabs(config) {
    tabTrack.innerHTML = '';
    config.tabs.forEach(tab => {
      const btn = document.createElement('button');
      btn.className = 'tab-btn';
      btn.dataset.tab = tab.id;
      btn.textContent = resolveTitle(tab.title);
      btn.addEventListener('click', () => loadTab(tab));
      tabTrack.appendChild(btn);
    });
  }

  async function initTabs() {
    try {
      const res = await fetch('./data/tabs.json');
      if (!res.ok) throw new Error('tabs.json 加载失败');
      tabsConfig = await res.json();
      buildTabs(tabsConfig);
      if (!tabsConfig.tabs.length) return;
      const lastId = sessionStorage.getItem(LAST_TAB_KEY);
      const lastTab = lastId && tabsConfig.tabs.find(t => t.id === lastId);
      loadTab(lastTab || tabsConfig.tabs[0]);
    } catch (e) {
      console.error(e);
      tabContent.innerHTML = '<div class="placeholder-content">栏目配置加载失败</div>';
    }
  }

  window.addEventListener('pageshow', (e) => {
    if (e.persisted && currentTab) loadTab(currentTab);
  });

  initTabs();
</script>

<!-- 加载 Wiki 介绍内容 -->
<script type="module">
  import { parseWiki } from './main/wikiParser.js';

  async function loadHomeWiki() {
    const container = document.getElementById('introText');
    try {
      const res = await fetch('./data/home/home.wiki?_=' + Date.now());
      if (!res.ok) throw new Error('加载失败');
      const text = await res.text();
      container.innerHTML = parseWiki(text);
    } catch (e) {
      container.innerHTML = '<div class="loading-placeholder">介绍文字不可用</div>';
    }
  }
  loadHomeWiki();
</script>
