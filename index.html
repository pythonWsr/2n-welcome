  <header class="main-header">
    <h1 class="main-title" id="guildTitle">[2n] 公会</h1>
    <div class="header-right">
      <div id="userAreaContainer" class="user-area-container"></div>
      <div class="settings-wrapper">
        <button class="settings-icon" id="settingsIcon" aria-label="设置">

        <div class="settings-dropdown" id="settingsDropdown" style="display:none;">
          <div class="settings-option" id="backToOldVersion">

          <div class="settings-option" id="clearCache">

        </div>
      </div>

  </header>

  <!-- 轮播区域（图片/视频混合） -->

    <div class="carousel-container" id="carousel">
      <div class="carousel-track" id="carouselTrack">
        <!-- 轮播项由 main/carousel.js 动态生成 -->
      </div>
      <button class="carousel-btn prev" id="carouselPrev" aria-label="上一张"><i class="fas fa-chevron-left"></i></button>
      <button class="carousel-btn next" id="carouselNext" aria-label="下一张"><i class="fas fa-chevron-right"></i></button>
      <div class="carousel-dots" id="carouselDots"></div>
    </div>
  </section>

  <!-- 介绍文字（由 Wiki 解析器动态渲染） -->
  <section class="intro-text" id="introText">
    <div class="loading-placeholder">加载中...</div>
  </section>

  <!-- 栏目标题横向滑动导航（按钮由 tabs.json 动态生成） -->
  <nav class="tab-nav" id="tabNav">
    <div class="tab-track" id="tabTrack">
      <!-- 按钮由脚本根据 ./data/tabs.json 生成 -->
    </div>
  </nav>

  <!-- 栏目内容容器 -->
  <main class="tab-content" id="tabContent">
    <div class="placeholder-content" id="tabPlaceholder">栏目加载中...</div>
  </main>

  <!-- 底部 -->
  <footer class="footer">
    <div class="version">Version 0.7.3</div>
    <div class="copyright"><i class="far fa-copyright"></i> Copyright 2026 GitHub@pythonWsr Florrio@flowerwsr</div>
  </footer>
</div>

<!-- Toast 提示 -->
<div class="toast-tip" id="copyToast">📋 已复制</div>

<!-- 动态加载调试工具脚本（根据 user 参数） -->
<script>
  (function() {
    const urlParams = new URLSearchParams(window.location.search);
    const user = urlParams.get('user');
    if (!user) return;

    function loadScript(src) {
      const script = document.createElement('script');
      script.src = src;
      script.defer = true;
      document.head.appendChild(script);
    }

    if (user === 'debug') {
      loadScript('./main/developers/debug.js');
    } else if (user === 'dev') {
      loadScript('./main/developers/dev.js');
    } else if (user === 'admin') {
      loadScript('./main/developers/admin.js');
    }
  })();
</script>

<!-- 重构提示弹窗（启用） -->

<!-- 设置菜单交互（外部脚本） -->

<!-- 栏目切换 + 内容加载（读取 data/tabs.json，支持 .html 中的 script/link 提取） -->
<script type="module">
  import { parseWiki } from './main/wikiParser.js';

  const tabTrack = document.getElementById('tabTrack');
  const tabContent = document.getElementById('tabContent');
  const wikiCache = {}; // 只缓存 .wiki 的渲染结果
  let tabsConfig = [];
  let currentTab = null;

  const LAST_TAB_KEY = 'main-last-tab';

  function resolveTitle(title) {
    if (typeof title === 'string') return title;
    if (title && typeof title === 'object') {
      const lang = (navigator.language || 'zh').toLowerCase().startsWith('zh') ? 'zh' : 'en';
      return title[lang] || title.zh || title.en || '';
    }
    return '';
  }

  // 处理 .html 内容：提取 <link rel=stylesheet> 注入 head，提取 <script> 执行
  async function processHtmlContent(html) {
    const doc = new DOMParser().parseFromString(html, 'text/html');

    // 样式表去重注入
    doc.querySelectorAll('link[rel="stylesheet"]').forEach(link => {
      const href = link.getAttribute('href');
      if (!href) return;
      const resolved = new URL(href, window.location.href).href;
      const exists = Array.from(document.querySelectorAll('link[rel="stylesheet"]'))
        .some(l => l.href === resolved);
      if (!exists) {
        const newLink = document.createElement('link');
        newLink.rel = 'stylesheet';
        newLink.href = resolved;
        document.head.appendChild(newLink);
      }
    });

    // 移出脚本（稍后执行）
    const scripts = Array.from(doc.querySelectorAll('script'));
    scripts.forEach(s => s.remove());

    // 注入 HTML 骨架
    tabContent.innerHTML = doc.body.innerHTML;

    // 执行脚本
    for (const oldScript of scripts) {
      await runScript(oldScript);
    }
  }

  function runScript(oldScript) {
    return new Promise(resolve => {
      const newScript = document.createElement('script');
      if (oldScript.type) newScript.type = oldScript.type;
      if (oldScript.src) {
        newScript.src = oldScript.src;
        newScript.onload = resolve;
        newScript.onerror = resolve;
      } else {
        newScript.textContent = oldScript.textContent;
      }
      document.body.appendChild(newScript);
      if (!oldScript.src) resolve();
    });
  }

  async function loadTab(tab) {
    if (!tab) return;
    currentTab = tab;
    sessionStorage.setItem(LAST_TAB_KEY, tab.id);

    // 切换 active 按钮状态
    tabTrack.querySelectorAll('.tab-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === tab.id);
    });

    tabContent.innerHTML = '<div class="placeholder-content">加载中...</div>';

    const path = `./${tab.folder}/${tab.entry}?_=${Date.now()}`;
    try {
      const res = await fetch(path);
      if (!res.ok) throw new Error('加载失败');
      const text = await res.text();

      if (tab.entry.endsWith('.wiki')) {
        if (!wikiCache[tab.id]) {
          wikiCache[tab.id] = parseWiki(text);
        }
        tabContent.innerHTML = wikiCache[tab.id];
      } else if (tab.entry.endsWith('.html')) {
        await processHtmlContent(text);
      } else if (tab.entry.endsWith('.json')) {
        tabContent.innerHTML = `<pre style="white-space:pre-wrap;">${escapeHtml(text)}</pre>`;
      } else {
        tabContent.innerHTML = text;
      }
    } catch (e) {
      console.error(`栏目 ${tab.id} 加载失败:`, e);
      tabContent.innerHTML = '<div class="placeholder-content">内容加载失败</div>';
    }
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function buildTabs(config) {
    tabTrack.innerHTML = '';
    config.tabs.forEach(tab => {
      const btn = document.createElement('button');
      btn.className = 'tab-btn';
      btn.dataset.tab = tab.id;
      btn.textContent = resolveTitle(tab.title);
      btn.addEventListener('click', () => loadTab(tab));
      tabTrack.appendChild(btn);
    });
  }

  async function initTabs() {
    try {
      const res = await fetch('./data/tabs.json');
      if (!res.ok) throw new Error('tabs.json 加载失败');
      tabsConfig = await res.json();
      buildTabs(tabsConfig);

      if (!tabsConfig.tabs.length) return;

      // 优先恢复上次的栏目（sessionStorage）
      const lastId = sessionStorage.getItem(LAST_TAB_KEY);
      const lastTab = lastId && tabsConfig.tabs.find(t => t.id === lastId);
      loadTab(lastTab || tabsConfig.tabs[0]);
    } catch (e) {
      console.error(e);
      tabContent.innerHTML = '<div class="placeholder-content">栏目配置加载失败</div>';
    }
  }

  // bfcache 恢复时：重新加载当前栏目（已读状态可能已变化）
  window.addEventListener('pageshow', (e) => {
    if (e.persisted && currentTab) {
      loadTab(currentTab);
    }
  });

  initTabs();
</script>

<!-- 加载 Wiki 介绍内容（顶部文字，与下方栏目独立） -->
<script type="module">
  import { parseWiki } from './main/wikiParser.js';

  async function loadHomeWiki() {
    const container = document.getElementById('introText');
    try {
      const res = await fetch('./data/home/home.wiki');
      if (!res.ok) throw new Error('加载失败');
      const text = await res.text();
      const html = parseWiki(text);
      container.innerHTML = html;
    } catch (e) {
      container.innerHTML = '<div class="loading-placeholder">介绍文字不可用</div>';
    }
  }

  loadHomeWiki();
</script>
