<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>[2n] 公会 · 欢迎</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="./main/css/base.css">
  <link rel="stylesheet" href="./main/css/components.css">
  <link rel="stylesheet" id="theme-link" href="./main/css/theme-light.css">
  <style>
    /* 临时修复：确保头部右侧区域靠右，设置下拉菜单完全可见 */
    .main-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .settings-wrapper {
      position: relative;
    }
    .settings-dropdown {
      position: absolute;
      top: 100%;
      right: 0;
      min-width: 160px;
      max-width: calc(100vw - 40px);
      z-index: 1000;
    }
  </style>
</head>
<body>
<div class="page">
  <!-- 顶部标题与设置 -->
  <header class="main-header">
    <h1 class="main-title" id="guildTitle">[2n] 公会</h1>
    <div class="header-right">
      <div id="userAreaContainer" class="user-area-container"></div>
      <div class="settings-wrapper">
        <button class="settings-icon" id="settingsIcon" aria-label="设置">
          <i class="fas fa-cog"></i>
        </button>
        <div class="settings-dropdown" id="settingsDropdown" style="display:none;">
          <div class="settings-option" id="backToOldVersion">
            <i class="fas fa-arrow-left"></i> 回到旧版本
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- 轮播区域（图片/视频混合） -->
  <section class="carousel-section" aria-label="活动与通知">
    <div class="carousel-container" id="carousel">
      <div class="carousel-track" id="carouselTrack">
        <!-- 轮播项由 main/carousel.js 动态生成 -->
      </div>
      <button class="carousel-btn prev" id="carouselPrev" aria-label="上一张"><i class="fas fa-chevron-left"></i></button>
      <button class="carousel-btn next" id="carouselNext" aria-label="下一张"><i class="fas fa-chevron-right"></i></button>
      <div class="carousel-dots" id="carouselDots"></div>
    </div>
  </section>

  <!-- 介绍文字（由 Wiki 解析器动态渲染） -->
  <section class="intro-text" id="introText">
    <div class="loading-placeholder">加载中...</div>
  </section>

  <!-- 栏目标题横向滑动导航 -->
  <nav class="tab-nav" id="tabNav">
    <div class="tab-track" id="tabTrack">
      <button class="tab-btn active" data-tab="home">首页</button>
      <button class="tab-btn" data-tab="announcements">通知</button>
      <button class="tab-btn" data-tab="surveys">问卷</button>
      <button class="tab-btn" data-tab="join">加入</button>
      <button class="tab-btn" data-tab="about">关于</button>
    </div>
  </nav>

  <!-- 栏目内容容器 -->
  <main class="tab-content" id="tabContent">
    <div class="placeholder-content" id="tabPlaceholder">首页内容加载中...</div>
  </main>

  <!-- 底部 -->
  <footer class="footer">
    <div class="version">Version 0.7.0</div>
    <div class="copyright"><i class="far fa-copyright"></i> Copyright 2026 GitHub@pythonWsr Florrio@flowerwsr</div>
  </footer>
</div>

<!-- Toast 提示 -->
<div class="toast-tip" id="copyToast">📋 已复制</div>

<!-- 动态加载调试工具脚本（根据 user 参数） -->
<script>
  (function() {
    const urlParams = new URLSearchParams(window.location.search);
    const user = urlParams.get('user');
    if (!user) return;

    function loadScript(src) {
      const script = document.createElement('script');
      script.src = src;
      script.defer = true;
      document.head.appendChild(script);
    }

    if (user === 'debug') {
      loadScript('./main/developers/debug.js');
    } else if (user === 'dev') {
      loadScript('./main/developers/dev.js');
    } else if (user === 'admin') {
      loadScript('./main/developers/admin.js');
    }
  })();
</script>

<!-- 重构提示弹窗（启用） -->
<script src="./main/refactorNotice.js"></script>

<!-- 轮播控制脚本 -->
<script src="./main/carousel.js"></script>

<!-- 设置菜单交互 + 栏目切换 -->
<script>
  document.addEventListener('DOMContentLoaded', () => {
    // ---------- 设置菜单 ----------
    const settingsIcon = document.getElementById('settingsIcon');
    const settingsDropdown = document.getElementById('settingsDropdown');
    const backBtn = document.getElementById('backToOldVersion');

    settingsIcon.addEventListener('click', (e) => {
      e.stopPropagation();
      settingsDropdown.style.display = settingsDropdown.style.display === 'none' ? 'block' : 'none';
    });

    document.addEventListener('click', (e) => {
      if (!settingsIcon.contains(e.target) && !settingsDropdown.contains(e.target)) {
        settingsDropdown.style.display = 'none';
      }
    });

    backBtn.addEventListener('click', () => {
      window.location.href = './v0/index.html';
    });

    // ---------- 栏目切换 ----------
    const tabButtons = document.querySelectorAll('.tab-btn');
    const tabPlaceholder = document.getElementById('tabPlaceholder');

    const tabTexts = {
      home: '首页内容加载中...',
      announcements: '通知内容加载中...',
      surveys: '问卷内容加载中...',
      join: '加入内容加载中...',
      about: '关于内容加载中...'
    };

    tabButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        tabButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const tab = btn.getAttribute('data-tab');
        if (tabPlaceholder && tabTexts[tab]) {
          tabPlaceholder.textContent = tabTexts[tab];
        }
      });
    });
  });
</script>

<!-- 加载 Wiki 介绍内容 -->
<script type="module">
  import { parseWiki } from './main/wikiParser.js';

  async function loadHomeWiki() {
    const container = document.getElementById('introText');
    try {
      const res = await fetch('./data/home/home.wiki');
      if (!res.ok) throw new Error('加载失败');
      const text = await res.text();
      const html = parseWiki(text);
      container.innerHTML = html;
    } catch (e) {
      container.innerHTML = '<div class="loading-placeholder">介绍文字不可用</div>';
    }
  }

  loadHomeWiki();
</script>

<!-- 主逻辑占位，后续接入 -->
<script type="module">
  // import { initApp } from './main/app.js';
  // initApp();
</script>
</body>
</html>
