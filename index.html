<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>[2n] 公会 · 欢迎</title>
  <!-- Font Awesome 图标库 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f5f7fa;
      font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
      color: #1e2b3c;
      padding: 20px 16px 30px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .page {
      max-width: 1000px;
      width: 100%;
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(2px);
      border-radius: 36px;
      padding: 24px 24px 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.05);
    }

    /* 头部：标题 + 语言切换 */
    .header-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .main-title {
      font-size: clamp(28px, 8vw, 52px);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.01em;
      background: linear-gradient(135deg, #0b3b5c, #2b5e7c);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-right: 16px;
    }

    /* 语言下拉组件 */
    .lang-wrapper {
      position: relative;
      user-select: none;
    }

    .lang-btn {
      background: white;
      border: 1px solid #cfdde9;
      border-radius: 40px;
      padding: 10px 18px;
      font-size: 1rem;
      font-weight: 500;
      color: #1e3b4f;
      box-shadow: 0 4px 8px rgba(0,0,0,0.02);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s;
      backdrop-filter: blur(4px);
      background: rgba(255,255,255,0.8);
    }

    .lang-btn i {
      font-size: 1rem;
      transition: transform 0.2s;
    }

    .lang-btn.active i {
      transform: rotate(180deg);
    }

    .lang-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      background: white;
      border-radius: 24px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.12);
      border: 1px solid #e2eaf1;
      overflow: hidden;
      min-width: 140px;
      z-index: 100;
      display: none;
    }

    .lang-dropdown.show {
      display: block;
    }

    .lang-option {
      padding: 12px 20px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.1s;
      color: #1e3b4f;
    }

    .lang-option:hover {
      background: #e6f0f9;
    }

    .lang-option.selected {
      background: #d4e2f0;
      color: #0a3144;
    }

    /* 领导区域 (会长/副会长) */
    .leaders {
      display: flex;
      justify-content: space-around;
      margin-bottom: 36px;
      gap: 12px;
    }

    .leader-card {
      flex: 1;
      text-align: center;
      background: rgba(255,255,255,0.5);
      border-radius: 40px;
      padding: 16px 8px 20px;
      backdrop-filter: blur(4px);
      box-shadow: 0 6px 12px rgba(46, 78, 102, 0.04);
    }

    .leader-emoji {
      font-size: clamp(3.5rem, 18vw, 8rem);
      line-height: 1;
    }

    .leader-label {
      font-size: 1.2rem;
      font-weight: 600;
      margin-top: 6px;
      color: #2b4e65;
    }

    .leader-name {
      font-size: 1.5rem;
      font-weight: 700;
      margin-top: 4px;
      color: #0b2f44;
      letter-spacing: 0.5px;
    }

    /* 矩形框上方小标题 */
    .section-titles {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .title-left {
      font-size: 1.6rem;
      font-weight: 700;
      color: #1b4b64;
      letter-spacing: -0.3px;
    }

    .title-right {
      font-size: 1.6rem;
      font-weight: 700;
      color: #1b4b64;
      text-align: right;
    }

    /* 主矩形卡片 */
    .info-card {
      background: #ffffffd9;
      backdrop-filter: blur(8px);
      border-radius: 32px;
      padding: 28px 24px;
      box-shadow: 0 20px 35px -8px rgba(21, 50, 70, 0.1);
      border: 1px solid #ffffff70;
      margin-bottom: 28px;
    }

    .card-content {
      display: flex;
      gap: 24px;
    }

    .quickstart-area {
      flex: 8;
      font-size: 1rem;
      line-height: 1.6;
      color: #1f3f54;
    }

    .quickstart-area p {
      margin-bottom: 1em;
    }

    .quickstart-area a {
      color: #1e6f9f;
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1.5px dotted #7fa9c7;
    }

    .quickstart-area a:hover {
      color: #0a4c70;
      border-bottom-style: solid;
    }

    .portal-area {
      flex: 2;
      border-left: 2px dashed #b7d0e2;
      padding-left: 20px;
    }

    .portal-list {
      list-style: none;
    }

    .portal-item {
      display: flex;
      flex-direction: column;
      margin-bottom: 24px;
    }

    .portal-label {
      font-weight: 700;
      color: #1e4e6b;
      margin-bottom: 6px;
      font-size: 0.95rem;
      letter-spacing: 0.3px;
    }

    .portal-value-row {
      display: flex;
      align-items: center;
      background: #ecf3f9;
      border-radius: 40px;
      padding: 6px 12px 6px 16px;
      word-break: break-all;
    }

    .portal-value-text {
      flex: 1;
      color: #0d3e58;
      font-size: 0.95rem;
      white-space: normal;
      word-break: break-all;
      line-height: 1.4;
      margin-right: 8px;
    }

    .copy-btn {
      background: none;
      border: none;
      color: #3a7799;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 30px;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .copy-btn:hover {
      background: #cbdde9;
      color: #0b3e5c;
    }

    /* 移动端适配 */
    @media (max-width: 680px) {
      .page { padding: 18px 16px 20px; }
      .card-content {
        flex-direction: column;
      }
      .portal-area {
        border-left: none;
        border-top: 2px dashed #b7d0e2;
        padding-left: 0;
        padding-top: 20px;
        margin-top: 8px;
      }
      .leader-emoji {
        font-size: clamp(3rem, 16vw, 7rem);
      }
    }

    /* 底部版权 + 版本号 */
    .footer {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: #8a9eb0;
      letter-spacing: 0.3px;
    }

    .footer .version {
      color: #8a9eb0;
    }

    .footer .copyright {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .footer i {
      margin-right: 2px;
    }

    /* 复制成功提示 */
    .toast-tip {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e3b4f;
      color: white;
      padding: 8px 18px;
      border-radius: 60px;
      font-size: 0.9rem;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>
<body>
<div class="page">
  <!-- 标题行 + 语言切换 -->
  <div class="header-row">
    <div class="main-title" id="guildTitle">加载中...</div>
    <div class="lang-wrapper" id="langWrapper">
      <div class="lang-btn" id="langButton">
        <span id="langDisplay">中文</span>
        <i class="fas fa-chevron-down" id="langArrow"></i>
      </div>
      <div class="lang-dropdown" id="langDropdown">
        <div class="lang-option" data-lang="zh">中文</div>
        <div class="lang-option" data-lang="en">English</div>
      </div>
    </div>
  </div>

  <!-- 会长 / 副会长 -->
  <div class="leaders">
    <div class="leader-card">
      <div class="leader-emoji">🥇</div>
      <div class="leader-label" id="leaderLabel1">会长</div>
      <div class="leader-name">awdc</div>
    </div>
    <div class="leader-card">
      <div class="leader-emoji">🥈</div>
      <div class="leader-label" id="leaderLabel2">副会长</div>
      <div class="leader-name">flowerwsr</div>
    </div>
  </div>

  <!-- 矩形上方小标题 -->
  <div class="section-titles">
    <div class="title-left" id="quickStartTitle">快速上手</div>
    <div class="title-right" id="portalTitle">传送门</div>
  </div>

  <!-- 矩形卡片区域 -->
  <div class="info-card">
    <div class="card-content">
      <div class="quickstart-area" id="quickstartContent"></div>
      <div class="portal-area">
        <ul class="portal-list" id="portalList"></ul>
      </div>
    </div>
  </div>

  <!-- 底部版权 + 版本号 -->
  <div class="footer">
    <div class="version">Version 0.1.3</div>
    <div class="copyright">
      <i class="far fa-copyright"></i> Copyright 2026 GitHub@pythonWsr Florrio@flowerwsr
    </div>
  </div>
</div>

<!-- 轻提示 -->
<div class="toast-tip" id="copyToast">📋 已复制</div>

<script>
  (function(){
    "use strict";

    // ---------- 语言配置 ----------
    const LANG_MAP = {
      zh: 'Chinese',
      en: 'English'
    };
    
    // 缓存已加载的语言包
    const langCache = {};

    // DOM 元素
    const guildTitleEl = document.getElementById('guildTitle');
    const langDisplaySpan = document.getElementById('langDisplay');
    const leaderLabel1 = document.getElementById('leaderLabel1');
    const leaderLabel2 = document.getElementById('leaderLabel2');
    const quickStartTitleEl = document.getElementById('quickStartTitle');
    const portalTitleEl = document.getElementById('portalTitle');
    const quickstartContent = document.getElementById('quickstartContent');
    const portalList = document.getElementById('portalList');

    const langBtn = document.getElementById('langButton');
    const langDropdown = document.getElementById('langDropdown');
    const langWrapper = document.getElementById('langWrapper');

    let currentLang = 'zh';

    // ---------- 加载语言文件 ----------
    async function loadLanguage(langCode) {
      const fileName = LANG_MAP[langCode] + '.json';
      const url = `./data/${fileName}`;
      
      // 如果已缓存，直接返回
      if (langCache[langCode]) {
        return langCache[langCode];
      }
      
      try {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`无法加载语言文件: ${url}`);
        }
        const data = await response.json();
        langCache[langCode] = data;
        return data;
      } catch (error) {
        console.error('语言加载失败:', error);
        return null;
      }
    }

    // ---------- 渲染页面 ----------
    function renderWithData(data) {
      if (!data) return;

      guildTitleEl.textContent = data.guildTitle;
      langDisplaySpan.textContent = data.langDisplay;
      leaderLabel1.textContent = data.leader1;
      leaderLabel2.textContent = data.leader2;
      quickStartTitleEl.textContent = data.quickStartTitle;
      portalTitleEl.textContent = data.portalTitle;

      quickstartContent.innerHTML = data.quickHtml;
      renderPortalItems(data.portalItems);
      
      // 更新下拉菜单选中样式
      document.querySelectorAll('.lang-option').forEach(opt => {
        opt.classList.toggle('selected', opt.dataset.lang === currentLang);
      });
    }

    // 渲染传送门
    function renderPortalItems(items) {
      portalList.innerHTML = '';
      items.forEach(item => {
        const li = document.createElement('li');
        li.className = 'portal-item';
        
        const labelDiv = document.createElement('div');
        labelDiv.className = 'portal-label';
        labelDiv.textContent = item.label;
        
        const valueRow = document.createElement('div');
        valueRow.className = 'portal-value-row';
        
        const valueSpan = document.createElement('span');
        valueSpan.className = 'portal-value-text';
        valueSpan.textContent = item.value;
        valueSpan.title = item.value;
        
        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-btn';
        copyBtn.innerHTML = '<i class="far fa-copy"></i>';
        copyBtn.setAttribute('aria-label', '复制');
        copyBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const textToCopy = item.value;
          if (navigator.clipboard?.writeText) {
            navigator.clipboard.writeText(textToCopy).then(() => {
              showToast('已复制');
            }).catch(() => fallbackCopy(textToCopy));
          } else {
            fallbackCopy(textToCopy);
          }
        });
        
        valueRow.appendChild(valueSpan);
        valueRow.appendChild(copyBtn);
        
        li.appendChild(labelDiv);
        li.appendChild(valueRow);
        portalList.appendChild(li);
      });
    }

    function fallbackCopy(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
      showToast('已复制');
    }

    const toast = document.getElementById('copyToast');
    let toastTimer;
    function showToast(msg) {
      toast.textContent = `📋 ${msg}`;
      toast.style.opacity = '1';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.style.opacity = '0';
      }, 1500);
    }

    // ---------- 切换语言 ----------
    async function switchLanguage(langCode) {
      if (langCode === currentLang) {
        closeDropdown();
        return;
      }
      
      const data = await loadLanguage(langCode);
      if (data) {
        currentLang = langCode;
        renderWithData(data);
        document.documentElement.lang = langCode === 'zh' ? 'zh' : 'en';
      }
      closeDropdown();
    }

    // ---------- 下拉交互 ----------
    function openDropdown() {
      langDropdown.classList.add('show');
      langBtn.classList.add('active');
    }
    function closeDropdown() {
      langDropdown.classList.remove('show');
      langBtn.classList.remove('active');
    }
    function toggleDropdown() {
      langDropdown.classList.contains('show') ? closeDropdown() : openDropdown();
    }

    langBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleDropdown();
    });

    document.querySelectorAll('.lang-option').forEach(opt => {
      opt.addEventListener('click', (e) => {
        e.stopPropagation();
        const lang = opt.dataset.lang;
        switchLanguage(lang);
      });
    });

    document.addEventListener('click', (e) => {
      if (!langWrapper.contains(e.target)) {
        closeDropdown();
      }
    });

    langDropdown.addEventListener('click', (e) => e.stopPropagation());

    // ---------- 初始化 ----------
    async function init() {
      // 预加载英文（可选）
      loadLanguage('en').catch(() => {});
      
      const data = await loadLanguage('zh');
      if (data) {
        renderWithData(data);
      } else {
        guildTitleEl.textContent = '欢迎各位花花加入[2n]公会';
        quickstartContent.innerHTML = '<p>语言文件加载失败，请刷新重试。</p>';
      }
    }

    init();
  })();
</script>
</body>
</html>
