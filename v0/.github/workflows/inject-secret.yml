name: Inject Secrets

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Replace placeholders
        run: |
          sed -i "s/__CHALLENGE_SECRET__/${{ secrets.CHALLENGE_SECRET }}/g" main/challenge.js
          sed -i "s/__SUBMIT_SECRET__/${{ secrets.SUBMIT_SECRET }}/g" main/submit.js

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add main/challenge.js main/submit.js
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Inject secrets [skip ci]"
          git pull --rebase origin main
          git push origin main