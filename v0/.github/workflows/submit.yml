name: Submit Survey

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON payload from frontend'
        required: true

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Process submission
        run: |
          mkdir -p database/results
          PAYLOAD='${{ github.event.inputs.payload }}'
          FILE_NAME=$(echo "$PAYLOAD" | jq -r '.file')
          FILE_HASH="${FILE_NAME%.*}"
          RESULT_FILE="database/results/${FILE_HASH}.json"
          USER=$(echo "$PAYLOAD" | jq -r '.user')
          if [ -f "$RESULT_FILE" ]; then
            jq --arg user "$USER" --argjson new "$(echo "$PAYLOAD" | jq '.')" \
              'map(select(.user != $user)) + [$new]' "$RESULT_FILE" > tmp.json
          else
            echo "[$PAYLOAD]" > tmp.json
          fi
          mv tmp.json "$RESULT_FILE"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add "$RESULT_FILE"
          git commit -m "Update survey result for $FILE_HASH" || true
          git push